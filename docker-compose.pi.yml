# Compose file for a Raspberry Pi running the LED panel.
#
# Architecture: web service in Docker, LED renderer on the host. Docker on
# Raspberry Pi OS doesn't allow real-time scheduling for cgroup-bound
# processes, which the LED library needs — driving the panel from a host
# systemd service is the only reliable path.
#
# Setup steps (one-time):
#   mkdir -p ~/tram-board/data && chmod 777 ~/tram-board/data && cd ~/tram-board
#   curl -O https://raw.githubusercontent.com/wiggi93/tram-board/master/docker-compose.pi.yml
#   docker compose -f docker-compose.pi.yml up -d
#
#   # Then install the host-side LED driver (one command):
#   curl -fsSL https://raw.githubusercontent.com/wiggi93/tram-board/master/host/install.sh \
#     | sudo bash
#
# Update later:
#   docker compose -f docker-compose.pi.yml pull
#   docker compose -f docker-compose.pi.yml up -d

services:
  tram-board:
    image: ${IMAGE:-profdrdisco/tram-board:latest}
    container_name: tram-board
    network_mode: host         # so the host LED driver can reach the API at 127.0.0.1:8080
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
    restart: unless-stopped
