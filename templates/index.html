<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tram Board · Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:        #0d0f12;
      --panel:     #161a20;
      --border:    #2a2f37;
      --text:      #e8eaed;
      --muted:     #8a93a0;
      --orange:    #ff7f50;
      --yellow:    #ffff00;
      --gold:      #ffc850;
      --badge-bg:  #0046c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    }
    h1 { font-size: 1.4rem; margin: 0; font-weight: 600; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      width: 100%;
      max-width: 540px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; }
    .row { display: flex; gap: 0.5rem; }
    input[type=text] {
      flex: 1;
      padding: 0.55rem 0.7rem;
      background: #0a0c10;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }
    input[type=text]:focus { outline: none; border-color: var(--orange); }
    button {
      padding: 0.55rem 1rem;
      background: var(--orange);
      color: #1a1a1a;
      border: 0;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 0.7rem; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
    .status.error { color: #ff6b6b; }
    .status.ok    { color: #6bcf7f; }

    /* ── Tabs ─────────────────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 0.25rem; width: 100%; max-width: 540px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.25rem;
    }
    .tab {
      flex: 1;
      padding: 0.5rem 0.8rem;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-radius: 7px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab.active { background: var(--orange); color: #1a1a1a; }
    .tab[aria-pressed="true"] { background: var(--orange); color: #1a1a1a; }

    /* ── Display preview ─────────────────────────────────────────────── */
    .preview {
      font-family: ui-monospace, "SF Mono", "Menlo", "DejaVu Sans Mono", monospace;
      font-size: 18px;
      line-height: 1.35;
      color: var(--text);
      background: #000;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      white-space: pre;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
    }
    .preview .badge { background: var(--badge-bg); color: #fff; }
    .preview .dest  { color: var(--orange); }
    .preview .mins  { color: var(--text); }
    .preview .mins.flash { color: var(--yellow); }
    .preview .clock { color: var(--muted); }
    .preview .border { color: #4a4f57; }
    .preview .text-line { color: var(--gold); }

    .meta { font-size: 0.8rem; color: var(--muted); text-align: center; }

    /* ── Weather ─────────────────────────────────────────────────────── */
    .weather-head {
      font-size: 0.85rem; color: var(--muted);
      margin-bottom: 0.6rem;
    }
    .weather-frame {
      font-family: ui-monospace, "SF Mono", "Menlo", "DejaVu Sans Mono", monospace;
      font-size: 16px;
      line-height: 1;
      color: var(--text);
      background: #000;
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: grid;
      grid-template-rows: repeat(5, auto);
      gap: 0.35rem;
    }
    .wrow {
      display: grid;
      grid-template-columns: 5.2ch 3.5ch 18px 4ch;
      align-items: center;
      gap: 0.6ch;
    }
    .wicon  { width: 18px; height: 18px; image-rendering: pixelated; justify-self: center; }
    .wtime  { color: var(--gold); font-weight: 600; }
    .wtemp  { color: var(--text); text-align: right; }
    .whumid { color: #8ec3ff;     text-align: right; }
    .weather-empty { color: var(--muted); padding: 1rem 0.2rem; }
  </style>
</head>
<body>
  <h1>Tram Board · Admin</h1>

  <div class="card">
    <label for="q">Station (free text — try "<em>stop city</em>")</label>
    <div class="row">
      <input id="q" type="text" placeholder="Kerstingstraße Hannover" autocomplete="off" />
      <button id="apply">Apply</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" data-tab="tram"    aria-pressed="true">Tram</button>
    <button class="tab" data-tab="text"    aria-pressed="false">Text</button>
    <button class="tab" data-tab="weather" aria-pressed="false">Weather</button>
  </div>

  <div class="card pane" data-pane="tram" style="padding: 1rem;">
    <div id="preview" class="preview">loading…</div>
    <div id="meta" class="meta" style="margin-top: 0.5rem;"></div>
  </div>

  <div class="card pane" data-pane="text" hidden>
    <label for="text-input">Free text (replaces the tram board on the panel)</label>
    <div class="row">
      <input id="text-input" type="text" placeholder="Hello world!" autocomplete="off" />
      <button id="text-apply">Apply</button>
    </div>
    <div id="text-status" class="status"></div>
    <div id="text-preview" class="preview" style="margin-top: 1rem;">loading…</div>
  </div>

  <div class="card pane" data-pane="weather" hidden style="padding: 1rem;">
    <div id="weather-head" class="weather-head">loading weather…</div>
    <div id="weather-body" class="weather-frame"></div>
  </div>

  <script>
    const W = 22; // debug-frame interior width

    function pad(s, n)     { s = String(s); return s.length >= n ? s.slice(0, n) : s + " ".repeat(n - s.length); }
    function padLeft(s, n) { s = String(s); return s.length >= n ? s.slice(-n) : " ".repeat(n - s.length) + s; }
    function center(s, n)  { const t = Math.max(0, n - s.length); const l = Math.floor(t/2); return " ".repeat(l) + s + " ".repeat(t - l); }
    function escape(s)     { return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

    function scrollOffset(row, len, visible) {
      const PAUSE = 3.5, SPEED = 0.38, HOLD = 2.0, STAGGER = 2.5;
      const max = Math.max(0, len - visible);
      if (max === 0) return 0;
      const dur = max * SPEED;
      const cycle = PAUSE + dur + HOLD;
      const t = ((Date.now() / 1000 - row * STAGGER) % cycle + cycle) % cycle;
      if (t < PAUSE) return 0;
      if (t < PAUSE + dur) return Math.floor((t - PAUSE) / SPEED);
      return max;
    }

    function renderTramFrame(state) {
      const border = "─".repeat(W);
      const lines = [`<span class="border">┌${border}┐</span>`];
      const deps = state.departures || [];
      const changedAt = state.changed_at || [];
      const now = Date.now() / 1000;
      for (let i = 0; i < 4; i++) {
        const dep = deps[i];
        if (dep) {
          const off  = scrollOffset(i, dep.destination.length, 9);
          const dest = pad(" " + pad(dep.destination.slice(off, off + 9), 9), 10);
          const mins = padLeft(String(dep.minutes), W - 12);
          const flash = (now - (changedAt[i] || 0)) < 1.5 ? " flash" : "";
          lines.push(
            `<span class="border">│</span>` +
            `<span class="badge">${escape(padLeft(dep.line.slice(0,2), 2))}</span>` +
            `<span class="dest">${escape(dest)}</span>` +
            `<span class="mins${flash}">${escape(mins)}</span>` +
            `<span class="border">│</span>`
          );
        } else {
          lines.push(`<span class="border">│</span>` + " ".repeat(W) + `<span class="border">│</span>`);
        }
      }
      const clock = new Date().toLocaleTimeString("de-DE", { hour12: false });
      lines.push(`<span class="border">│</span><span class="clock">${center(clock, W)}</span><span class="border">│</span>`);
      lines.push(`<span class="border">└${border}┘</span>`);
      return lines.join("\n");
    }

    // Mirror of WEATHER_ICONS in led.py / host/led-driver.py — same 6×6 sprites
    // and palettes so the admin preview looks like the LED panel.
    const WEATHER_ICONS = {
      sun: {
        rows: ["..XX..", "X....X", ".XXXX.", ".XXXX.", "X....X", "..XX.."],
        palette: { X: "#ffdc3c" },
      },
      cloudy_sun: {
        rows: ["..X...", "XXX...", ".X.YY.", "YYYYYY", ".YYYY.", "......"],
        palette: { X: "#ffdc3c", Y: "#b4b4b4" },
      },
      cloud: {
        rows: ["..XX..", ".XXXX.", "XXXXXX", ".XXXX.", "......", "......"],
        palette: { X: "#b4b4b4" },
      },
      rain: {
        rows: [".XXXX.", "XXXXXX", ".XXXX.", "Y.Y.Y.", ".Y.Y.Y", "......"],
        palette: { X: "#b4b4b4", Y: "#64aaff" },
      },
      snow: {
        rows: [".XXXX.", "XXXXXX", "......", "Y.Y.Y.", ".Y.Y.Y", "Y.Y.Y."],
        palette: { X: "#b4b4b4", Y: "#ffffff" },
      },
      thunder: {
        rows: [".XXXX.", "XXXXXX", "..Y...", ".YY...", "..Y...", ".Y...."],
        palette: { X: "#b4b4b4", Y: "#ffdc3c" },
      },
      fog: {
        rows: ["XXXXXX", "......", "XXXXXX", "......", "XXXXXX", "......"],
        palette: { X: "#b4b4b4" },
      },
    };

    function iconSVG(name) {
      const spec = WEATHER_ICONS[name] || WEATHER_ICONS.cloud;
      const cells = [];
      for (let y = 0; y < spec.rows.length; y++) {
        const row = spec.rows[y];
        for (let x = 0; x < row.length; x++) {
          const c = spec.palette[row[x]];
          if (c) cells.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`);
        }
      }
      return `<svg class="wicon" viewBox="0 0 6 6" shape-rendering="crispEdges">${cells.join("")}</svg>`;
    }

    function renderWeatherFrame(weather) {
      const head = document.getElementById("weather-head");
      const body = document.getElementById("weather-body");
      const periods = (weather && weather.periods) || [];
      if (!periods.length) {
        head.textContent = (weather && weather.error) || "loading weather…";
        body.innerHTML   = `<div class="weather-empty">no forecast yet</div>`;
        return;
      }
      const place = (weather && weather.place) || "";
      const updated = weather && weather.updated_at
        ? `updated ${new Date(weather.updated_at * 1000).toLocaleTimeString("de-DE", { hour12: false })}`
        : "";
      head.textContent = [place && `Today · ${place}`, updated].filter(Boolean).join("  ·  ");
      body.innerHTML = periods.slice(0, 5).map(p => {
        const time  = p.time || "";
        const temp  = (p.temp_hi  != null) ? `${String(Math.round(p.temp_hi)).padStart(2)}°` : " --";
        const humid = (p.humidity != null) ? `${Math.round(p.humidity)}%`                   : "";
        return `<div class="wrow">` +
               `<span class="wtime">${escape(time)}</span>` +
               `<span class="wtemp">${escape(temp)}</span>` +
               `${iconSVG(p.icon || "cloud")}` +
               `<span class="whumid">${escape(humid)}</span>` +
               `</div>`;
      }).join("");
    }

    function renderTextFrame(state) {
      const text  = state.text || "";
      const t0    = state.text_changed_at || 0;
      const speed = 6;          // chars per second — matches the LED's ~30 px/s
      const cycle = text.length + W;
      const offset = text.length === 0 ? 0
                   : Math.floor((Date.now() / 1000 - t0) * speed) % cycle;
      const padded = " ".repeat(W) + text + " ".repeat(W);
      const window = padded.substring(offset, offset + W);

      const border = "─".repeat(W);
      const blank  = `<span class="border">│</span>${" ".repeat(W)}<span class="border">│</span>`;
      return [
        `<span class="border">┌${border}┐</span>`,
        blank, blank,
        `<span class="border">│</span><span class="text-line">${escape(window)}</span><span class="border">│</span>`,
        blank, blank, blank,
        `<span class="border">└${border}┘</span>`,
      ].join("\n");
    }

    // The active admin tab is also the LED mode — Tram, Text, and Weather all
    // drive what the panel shows.
    let adminTab = "tram";
    const LOCAL_OVERRIDE_MS = 1500;
    let lastLocalModeChange = 0;

    async function setTab(tab, fromServer) {
      adminTab = tab;
      document.querySelectorAll(".tab").forEach(b => {
        const active = b.dataset.tab === tab;
        b.classList.toggle("active", active);
        b.setAttribute("aria-pressed", active ? "true" : "false");
      });
      document.querySelectorAll(".pane").forEach(p => {
        p.hidden = p.dataset.pane !== tab;
      });
      if (!fromServer) {
        lastLocalModeChange = Date.now();
        try {
          await fetch("/api/mode", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode: tab }),
          });
        } catch (_) { /* ignore — refresh will recover */ }
      }
    }

    async function refresh() {
      try {
        const res  = await fetch("/api/state");
        const data = await res.json();

        const ignoreServerMode = (Date.now() - lastLocalModeChange) < LOCAL_OVERRIDE_MS;
        if (!ignoreServerMode && data.mode && data.mode !== adminTab) {
          setTab(data.mode, true);
        }

        document.getElementById("preview").innerHTML      = renderTramFrame(data);
        document.getElementById("text-preview").innerHTML = renderTextFrame(data);
        renderWeatherFrame(data.weather);

        const station = data.station_name
          ? `${data.station_name}${data.station_city ? ", " + data.station_city : ""}  ·  ${data.stop_id || ""}`
          : "no station configured";
        const updated = data.last_update
          ? `last update ${new Date(data.last_update * 1000).toLocaleTimeString("de-DE", { hour12: false })}`
          : "waiting for first fetch…";
        const err = data.last_error ? `  ·  error: ${data.last_error}` : "";
        document.getElementById("meta").textContent = `${station}  ·  ${updated}${err}`;

        if (!document.activeElement || document.activeElement.id !== "q") {
          document.getElementById("q").placeholder = data.station_query || "Kerstingstraße Hannover";
        }
        if (!document.activeElement || document.activeElement.id !== "text-input") {
          document.getElementById("text-input").placeholder = data.text || "Hello world!";
        }
      } catch (e) {
        document.getElementById("meta").textContent = `cannot reach server: ${e}`;
      }
    }

    async function applyStation() {
      const input = document.getElementById("q");
      const status = document.getElementById("status");
      const button = document.getElementById("apply");
      const query  = input.value.trim();
      if (!query) { input.focus(); return; }
      button.disabled = true;
      status.className = "status";
      status.textContent = "resolving…";
      try {
        const res = await fetch("/api/station", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });
        const data = await res.json();
        if (!res.ok) {
          status.className = "status error";
          status.textContent = data.error || `error ${res.status}`;
        } else {
          status.className = "status ok";
          status.textContent = `→ ${data.station_name}, ${data.station_city} (${data.stop_id})`;
          input.value = "";
          refresh();
        }
      } catch (e) {
        status.className = "status error";
        status.textContent = String(e);
      } finally {
        button.disabled = false;
      }
    }

    async function applyText() {
      const input  = document.getElementById("text-input");
      const status = document.getElementById("text-status");
      const button = document.getElementById("text-apply");
      const text   = input.value;
      button.disabled = true;
      status.className = "status";
      status.textContent = "saving…";
      try {
        const res = await fetch("/api/text", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await res.json();
        if (!res.ok) {
          status.className = "status error";
          status.textContent = data.error || `error ${res.status}`;
        } else {
          status.className = "status ok";
          status.textContent = text ? `set: "${text}"` : "cleared";
          refresh();
        }
      } catch (e) {
        status.className = "status error";
        status.textContent = String(e);
      } finally {
        button.disabled = false;
      }
    }

    document.querySelectorAll(".tab").forEach(b =>
      b.addEventListener("click", () => setTab(b.dataset.tab))
    );
    document.getElementById("apply").addEventListener("click", applyStation);
    document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") applyStation(); });
    document.getElementById("text-apply").addEventListener("click", applyText);
    document.getElementById("text-input").addEventListener("keydown", e => { if (e.key === "Enter") applyText(); });

    refresh();
    setInterval(refresh, 250);   // faster refresh so text scrolls smoothly
  </script>
</body>
</html>
